[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ddr-ai-builder"
version = "0.1.0"
description = "AI workflow for DDR report generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "streamlit>=1.38.0",
  "PyMuPDF>=1.24.0",
  "python-docx>=1.1.2",
  "rapidfuzz>=3.9.0",
  "pyyaml>=6.0.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
